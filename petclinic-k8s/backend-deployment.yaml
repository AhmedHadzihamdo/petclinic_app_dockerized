apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ahmedhamdo/petclinic-backend:latest
        env:
        - name: POSTGRES_URL
          value: jdbc:postgresql://postgres-service:5432/petclinic
        - name: POSTGRES_USER
          value: petclinic
        - name: POSTGRES_PASSWORD
          value: petclinic
        ports:
        - containerPort: 9966

