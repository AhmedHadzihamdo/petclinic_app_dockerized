apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ahmedhamdo/petclinic-frontend_v6:latest
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        ports:
        - containerPort: 80
        env: 
        - name: REST_API_URL 
          value: "http://backend-service:9966/petclinic/api"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
