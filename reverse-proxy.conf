# Reverse proxy frontend app
server {
    listen 80;
    server_name frontend.praksa.abhapp.com;

    large_client_header_buffers 8 32k;

    location / {
        proxy_pass http://localhost:8080; # Port frontend aplikacije
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";
        proxy_redirect off;
    }
}

# Reverse proxy backend app
server {
    listen 80;
    server_name backend.praksa.abhapp.com;

    large_client_header_buffers 8 32k;

    location / {
        proxy_pass http://localhost:9966; # Port backend aplikacije
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";
        proxy_redirect off;
    }
}


